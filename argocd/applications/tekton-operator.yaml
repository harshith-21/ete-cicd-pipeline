apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-operator
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tektoncd/operator.git
    targetRevision: v0.81.0
    path: config

  destination:
    server: https://kubernetes.default.svc
    namespace: tekton-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true