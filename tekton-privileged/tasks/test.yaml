apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-test
  namespace: tekton-pipelines

spec:
  params:
    - name: context
      type: string
      default: go-calculator

  workspaces:
    - name: source

  steps:
    - name: test
      image: golang:1.26-alpine
      workingDir: $(workspaces.source.path)/$(params.context)

      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      env:
        - name: GOPATH
          value: /tmp/go
        - name: GOCACHE
          value: /tmp/go-cache

      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Go Test"
        echo "========================================"

        echo "Go version:"
        go version

        echo "Working directory:"
        pwd

        echo "Go module:"
        cat go.mod

        echo "Running tests..."

        go test ./...

        echo "========================================"
        echo "Tests passed"
        echo "========================================"