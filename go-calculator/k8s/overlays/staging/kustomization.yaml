apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-calculator-staging

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: go-calculator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: go-calculator
      spec:
        template:
          spec:
            containers:
              - name: go-calculator
                image: harbor.harbor.svc.cluster.local/library/go-calculator:1.1.1
                env:
                  - name: ENV
                    value: "staging"
                  - name: THEME_COLOR
                    value: "#3b82f6"