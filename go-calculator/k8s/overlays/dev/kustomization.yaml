patches:
  - target:
      kind: Deployment
      name: go-calculator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: go-calculator
      spec:
        template:
          spec:
            containers:
              - name: go-calculator
                env:
                  - name: ENV
                    value: "dev"
                  - name: THEME_COLOR
                    value: "#a855f7"