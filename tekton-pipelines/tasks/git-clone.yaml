apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-pipelines

spec:
  params:
    - name: url
      type: string

    - name: revision
      type: string

    - name: deleteExisting
      type: string
      default: "true"

  workspaces:
    - name: output

  steps:
    - name: clone
      image: alpine/git:2.47.2

      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      script: |
        #!/bin/sh
        set -eu

        OUTPUT="$(workspaces.output.path)"

        echo "Cleaning workspace..."

        if [ "$(params.deleteExisting)" = "true" ]; then
          find "$OUTPUT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi

        cd "$OUTPUT"

        echo "Initializing repository..."

        git init

        git remote add origin "$(params.url)"

        echo "Fetching revision $(params.revision)..."

        git fetch --depth=1 origin "$(params.revision)"

        echo "Checking out revision..."

        git checkout FETCH_HEAD

        echo "Checked out:"
        git rev-parse HEAD