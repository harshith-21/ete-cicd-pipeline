apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: tekton-pipelines

spec:
  params:
    - name: IMAGE
      type: string

    - name: VERSION
      type: string

    - name: GIT_REVISION
      type: string

    - name: CONTEXT
      type: string
      default: go-calculator

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.41.0

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      env:
        - name: HOME
          value: /tmp

        - name: REGISTRY_AUTH_FILE
          value: /tmp/containers/auth.json

        - name: STORAGE_DRIVER
          value: vfs

      volumeMounts:
        - name: harbor-docker-config
          mountPath: /tmp/containers
          readOnly: true

      workingDir: $(workspaces.source.path)/$(params.CONTEXT)

      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Build and Push"
        echo "========================================"

        echo "Image    : $(params.IMAGE)"
        echo "Version  : $(params.VERSION)"
        echo "Revision : $(params.GIT_REVISION)"

        echo ""
        echo "Buildah:"
        buildah version

        echo ""
        echo "Building..."

        buildah bud \
          --storage-driver="${STORAGE_DRIVER}" \
          --tag="$(params.IMAGE)" \
          --label="org.opencontainers.image.version=$(params.VERSION)" \
          --label="org.opencontainers.image.revision=$(params.GIT_REVISION)" \
          .

        echo ""
        echo "Pushing..."

        buildah push \
          --storage-driver="${STORAGE_DRIVER}" \
          "$(params.IMAGE)" \
          "docker://$(params.IMAGE)"

        echo ""
        echo "========================================"
        echo "Build and push completed"
        echo "========================================"

  volumes:
    - name: harbor-docker-config
      secret:
        secretName: harbor-credentials
        items:
          - key: .dockerconfigjson
            path: auth.json