apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: tekton-pipelines

spec:
  params:
    - name: IMAGE
      type: string

    - name: VERSION
      type: string

    - name: GIT_REVISION
      type: string

    - name: CONTEXT
      type: string
      default: go-calculator

  workspaces:
    - name: source

  volumes:
    - name: harbor-docker-config
      secret:
        secretName: harbor-credentials
        items:
          - key: .dockerconfigjson
            path: config.json

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      volumeMounts:
        - name: harbor-docker-config
          mountPath: /kaniko/.docker
          readOnly: true

      workingDir: $(workspaces.source.path)/$(params.CONTEXT)

      command:
        - /kaniko/executor

      args:
        - --context=$(workspaces.source.path)/$(params.CONTEXT)
        - --dockerfile=$(workspaces.source.path)/$(params.CONTEXT)/Dockerfile
        - --destination=$(params.IMAGE):$(params.VERSION)
        - --cache=true
        - --cache-repo=$(params.IMAGE)-cache
        - --label=org.opencontainers.image.version=$(params.VERSION)
        - --label=org.opencontainers.image.revision=$(params.GIT_REVISION)