apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: tekton-pipelines

spec:
  params:
    - name: IMAGE
      type: string
      description: Full image name including tag

    - name: VERSION
      type: string
      description: Application version

    - name: GIT_REVISION
      type: string
      description: Git revision

    - name: CONTEXT
      type: string
      default: go-calculator

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: moby/buildkit:rootless

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      env:
        - name: HOME
          value: /tmp

        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox

      volumeMounts:
        - name: harbor-docker-config
          mountPath: /tmp/.docker
          readOnly: true

      workingDir: $(workspaces.source.path)/$(params.CONTEXT)

      script: |
        #!/bin/sh
        set -eu

        echo "========================================"
        echo "Build and Push"
        echo "========================================"

        echo "Image     : $(params.IMAGE)"
        echo "Version   : $(params.VERSION)"
        echo "Revision  : $(params.GIT_REVISION)"
        echo "Context   : $(workspaces.source.path)/$(params.CONTEXT)"

        echo ""
        echo "Dockerfile:"
        cat Dockerfile

        echo ""
        echo "Starting BuildKit..."

        buildkitd \
          --addr unix:///tmp/buildkitd.sock \
          ${BUILDKITD_FLAGS} \
          > /tmp/buildkitd.log 2>&1 &

        BUILDKITD_PID=$!

        cleanup() {
          kill "$BUILDKITD_PID" 2>/dev/null || true
        }

        trap cleanup EXIT

        echo "Waiting for BuildKit..."

        for i in $(seq 1 30); do
          if buildctl \
            --addr unix:///tmp/buildkitd.sock \
            debug workers >/dev/null 2>&1; then
            break
          fi

          sleep 1
        done

        echo "BuildKit ready."

        echo ""
        echo "Building image..."

        buildctl \
          --addr unix:///tmp/buildkitd.sock \
          build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --output type=image,name=$(params.IMAGE),push=true \
          --label org.opencontainers.image.version=$(params.VERSION) \
          --label org.opencontainers.image.revision=$(params.GIT_REVISION)

        echo ""
        echo "========================================"
        echo "Build and push completed"
        echo "========================================"

  volumes:
    - name: harbor-docker-config
      secret:
        secretName: harbor-credentials
        items:
          - key: .dockerconfigjson
            path: config.json