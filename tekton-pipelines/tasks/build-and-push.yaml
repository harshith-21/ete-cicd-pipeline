apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: tekton-privileged

spec:
  params:
    - name: IMAGE
      type: string

    - name: VERSION
      type: string

    - name: GIT_REVISION
      type: string

    - name: CONTEXT
      type: string
      default: go-calculator

  workspaces:
    - name: source

  volumes:
    - name: docker-config
      secret:
        secretName: harbor-credentials
        items:
          - key: .dockerconfigjson
            path: config.json

    - name: buildkit-state
      emptyDir: {}

    - name: buildkit-tmp
      emptyDir: {}

  steps:
    - name: build-and-push
      image: moby/buildkit:v0.25.1-rootless

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault

      env:
        - name: HOME
          value: /home/user

        - name: XDG_RUNTIME_DIR
          value: /tmp/buildkit

        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox

      volumeMounts:
        - name: docker-config
          mountPath: /home/user/.docker
          readOnly: true

        - name: buildkit-state
          mountPath: /home/user/.local/share/buildkit

        - name: buildkit-tmp
          mountPath: /tmp

      workingDir: $(workspaces.source.path)/$(params.CONTEXT)

      command:
        - buildctl-daemonless.sh

      args:
        - build

        - --frontend=dockerfile.v0

        - --local
        - context=$(workspaces.source.path)/$(params.CONTEXT)

        - --local
        - dockerfile=$(workspaces.source.path)/$(params.CONTEXT)

        - --output
        - type=image,name=$(params.IMAGE):$(params.VERSION),push=true

        - --opt
        - filename=Dockerfile