apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: go-test
  namespace: tekton-pipelines

spec:
  workspaces:
    - name: source

  steps:
    - name: test
      image: golang:1.25-alpine

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        echo "Running Go tests..."

        go test ./...