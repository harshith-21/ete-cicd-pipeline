apiVersion: batch/v1
kind: CronJob
metadata:
  name: go-calculator-poller
  namespace: tekton-pipelines

spec:
  # Poll every 2 minutes
  schedule: "*/2 * * * *"

  # Never run two pollers simultaneously
  concurrencyPolicy: Forbid

  # Don't keep failed Jobs forever
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1

      template:
        metadata:
          labels:
            app: go-calculator-poller

        spec:
          serviceAccountName: go-calculator-poller

          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: poller

              # Has git + shell. We download kubectl below.
              image: harshith21/tekton-poller:latest
              imagePullPolicy: IfNotPresent

              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault

              env:
                - name: GIT_URL
                  value: "https://github.com/harshith-21/ete-cicd-pipeline.git"

                - name: GIT_REVISION
                  value: "main"

                - name: APP_PATH
                  value: "go-calculator"

                - name: IMAGE_REPOSITORY
                  value: "harbor.harbor.svc.cluster.local/library/go-calculator"

                - name: KUBECTL_VERSION
                  value: "v1.34.1"

              command:
                - /bin/bash
                - -c

              args:
                - |
                  set -euo pipefail

                  echo "========================================"
                  echo "Go Calculator Poller"
                  echo "========================================"

                  # --------------------------------------------------
                  # Install kubectl into writable /tmp
                  # --------------------------------------------------

                  echo "Installing kubectl ${KUBECTL_VERSION}..."

                  curl -fsSL \
                    "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
                    -o /tmp/kubectl

                  chmod +x /tmp/kubectl

                  KUBECTL="/tmp/kubectl"

                  echo "kubectl:"
                  "$KUBECTL" version --client

                  # --------------------------------------------------
                  # Get current Git commit SHA
                  # --------------------------------------------------

                  echo "Checking Git repository..."

                  REVISION=$(
                    git ls-remote \
                      "$GIT_URL" \
                      "refs/heads/$GIT_REVISION" \
                    | awk '{print $1}'
                  )

                  if [ -z "$REVISION" ]; then
                    echo "ERROR: Could not determine Git revision"
                    exit 1
                  fi

                  echo "Git revision: $REVISION"

                  # --------------------------------------------------
                  # Get VERSION
                  # --------------------------------------------------

                  VERSION=$(
                    curl -fsSL \
                    "https://raw.githubusercontent.com/harshith-21/ete-cicd-pipeline/${GIT_REVISION}/${APP_PATH}/VERSION"
                  )

                  VERSION=$(echo "$VERSION" | tr -d '[:space:]')

                  if [ -z "$VERSION" ]; then
                    echo "ERROR: VERSION is empty"
                    exit 1
                  fi

                  echo "Application version: $VERSION"

                  # --------------------------------------------------
                  # Check whether this version was already processed
                  # --------------------------------------------------

                  echo "Checking existing PipelineRuns..."

                  EXISTING=$(
                    "$KUBECTL" get pipelineruns \
                      -n tekton-pipelines \
                      -l "app=go-calculator,version=$VERSION" \
                      --no-headers 2>/dev/null || true
                  )

                  if [ -n "$EXISTING" ]; then
                    echo "Version $VERSION already processed."
                    echo "$EXISTING"
                    exit 0
                  fi

                  # --------------------------------------------------
                  # New version
                  # --------------------------------------------------

                  echo "========================================"
                  echo "NEW VERSION DETECTED"
                  echo "Version : $VERSION"
                  echo "Revision: $REVISION"
                  echo "========================================"

                  # --------------------------------------------------
                  # Create PipelineRun
                  # --------------------------------------------------

                  cat <<EOF | "$KUBECTL" apply -f -
                  apiVersion: tekton.dev/v1
                  kind: PipelineRun
                  metadata:
                    generateName: go-calculator-
                    namespace: tekton-pipelines
                    labels:
                      app: go-calculator
                      version: "$VERSION"
                  spec:
                    taskRunTemplate:
                      serviceAccountName: go-calculator-pipeline

                    pipelineRef:
                      name: go-calculator

                    params:
                      - name: git-url
                        value: "$GIT_URL"

                      - name: git-revision
                        value: "$REVISION"

                      - name: version
                        value: "$VERSION"

                      - name: image-repository
                        value: "$IMAGE_REPOSITORY"

                      - name: image-tag
                        value: "$VERSION"

                      - name: context
                        value: "$APP_PATH"

                    workspaces:
                      - name: source
                        volumeClaimTemplate:
                          spec:
                            accessModes:
                              - ReadWriteOnce
                            resources:
                              requests:
                                storage: 2Gi
                  EOF

                  echo "========================================"
                  echo "PipelineRun created successfully"
                  echo "========================================"